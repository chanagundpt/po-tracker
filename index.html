async function importExtraFile(file){
  let rows;
  try{
    await loadScript(XLSX_SRC);
    const wb=XLSX.read(await file.arrayBuffer(), {type:'array'});
    rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:false, defval:''}).filter(r=>r.some(c=>String(c).trim()));
  }catch(e){ fail(e); return; }
  if(rows.length<2){ toast('ไฟล์ไม่มีข้อมูล', true); return; }
  // หาแถวหัวตารางจริง (บางไฟล์มีหัวเรื่องอยู่ด้านบน)
  const KW=/barcode|บาร์โค้ด|sku|รหัส|code|id|ชื่อ|name|สินค้า|product/i;
  let hi=0, hs=-1;
  rows.slice(0,10).forEach((r,i)=>{ const sc=r.filter(c=>String(c).trim() && KW.test(String(c)) && String(c).length<40).length; if(sc>hs){ hs=sc; hi=i; } });
  rows=rows.slice(hi);
  const head=rows[0].map(x=>String(x).trim());
  const guess=re=>head.findIndex(x=>re.test(x));
  let cSku=guess(/sku/i), cName=guess(/ชื่อ|name|สินค้า|product/i);
  let cCode=head.findIndex((x,i)=>i!==cSku && /barcode|บาร์โค้ด|ean/i.test(x));
  if(cCode<0) cCode=head.findIndex((x,i)=>i!==cSku && /รหัส|code|tracking|แทร็ก|เลข/i.test(x));
  if(cCode<0) cCode=head.findIndex((x,i)=>i!==cSku && i!==cName);
  const cCode2=head.findIndex((x,i)=>i!==cSku && i!==cCode && i!==cName && /id|รหัส|code|tracking|เลข/i.test(x));
  const sel=(id,cur,allowNone)=>`<select id="${id}">${allowNone?'<option value="-1">— ไม่มี —</option>':''}${head.map((x,i)=>`<option value="${i}" ${i===cur?'selected':''}>${h(x||'คอลัมน์ '+(i+1))}</option>`).join('')}</select>`;
  const md=openModal(`<div class="modal-head">นำเข้ารหัสสินค้าเพิ่มเติม</div><div class="modal-body">
    <div class="ref">${h(file.name)} • ${num(rows.length-1)} แถว — เลือกว่าคอลัมน์ไหนคืออะไร</div>
    <div class="map-grid">
      <div class="f"><label>รหัสอื่น / บาร์โค้ดที่ P.O. ใช้ *</label>${sel('mCode',cCode)}</div>
      <div class="f"><label>รหัสอื่น 2 (เช่น Konvy ID)</label>${sel('mCode2',cCode2,true)}</div>
      <div class="f"><label>SKU ใน JST</label>${sel('mSku',cSku,true)}</div>
      <div class="f"><label>ชื่อสินค้า</label>${sel('mName',cName,true)}</div>
    </div>
    <div style="overflow:auto"><table class="prev-table"><tr>${head.map(x=>`<th>${h(x)}</th>`).join('')}</tr>
      ${rows.slice(1,6).map(r=>`<tr>${head.map((_,i)=>`<td>${h(r[i])}</td>`).join('')}</tr>`).join('')}</table></div>
  </div><div class="modal-foot"><button class="btn" data-x>ยกเลิก</button><button class="btn primary" data-ok>นำเข้า</button></div>`, true);
  $('[data-x]',md.el).onclick=()=>md.close();
  $('[data-ok]',md.el).onclick=async()=>{
    const ci=Number($('#mCode',md.el).value), c2=Number($('#mCode2',md.el).value), si=Number($('#mSku',md.el).value), ni=Number($('#mName',md.el).value);
    const data=[];
    rows.slice(1).forEach(r=>{
      [ci, c2].filter(i=>i>=0).forEach(i=>{
        const code=String(r[i]||'').replace(/^\*+/,'').trim();
        if(code && /\d/.test(code)) data.push({code, sku:si>=0?r[si]:'', name:ni>=0?r[ni]:'', note:'นำเข้าจาก '+file.name+' ('+head[i]+')'});
      });
    });
    for(let i=data.length-1;i>=0;i--) if(!(String(data[i].sku).trim()||String(data[i].name).trim())) data.splice(i,1);
    if(!data.length){ toast('ไม่มีแถวที่ใช้ได้ (ต้องมีรหัส และ SKU หรือชื่อ)', true); return; }
    $('[data-ok]',md.el).disabled=true;
    try{
      let added=0, updated=0;
      for(let i=0;i<data.length;i+=500){ const r=await call('addExtraCodes',{rows:data.slice(i,i+500)}); added+=r.added; updated+=r.updated; }
      md.close(); toast('นำเข้าแล้ว: ใหม่ '+added+' • อัปเดต '+updated); await loadProducts();
    }catch(e){ fail(e); $('[data-ok]',md.el).disabled=false; }
  };
}

async function resolveDup(action){
  const po=S.detail.po;
  const msg={update:'ใบเดิมจะกลายเป็น “ใบเก่า” (สีเทา) และใบนี้จะกลับไปขั้น “รับเข้า P.O.”\nข้อมูลที่กรอกไว้ในใบเดิม (ลูกค้า แบรนด์ รายการสินค้า หมายเหตุ) จะคัดลอกมาให้ถ้าใบนี้ยังว่าง',
    separate:'ยืนยันว่าเป็น P.O. คนละใบ (เลขซ้ำแต่ไม่เกี่ยวกัน) — ใบนี้จะเข้าขั้น “รับเข้า P.O.”', delete:'ลบใบซ้ำนี้ออกจากรายการ (กู้คืนได้ที่หัวข้อ “ถูกลบ”)'}[action];
  if(!await confirmBox({update:'อัปเดต P.O.',separate:'เป็น P.O. คนละใบ',delete:'ลบใบซ้ำ'}[action], msg, 'ยืนยัน', action==='delete')) return;
  try{
    await call('resolveDuplicate',{id:po.id, action});
    toast(action==='update'?'อัปเดต P.O. แล้ว — ใบเดิมเป็นใบเก่า':action==='separate'?'ย้ายไปขั้นรับเข้า P.O. แล้ว':'ลบใบซ้ำแล้ว');
    await load(true);
    if(action==='delete') closeDetail(); else await refreshDetail();
  }catch(e){ fail(e); }
}
async function deletePo(id){
  const po=S.pos.find(p=>p.id===id) || (S.detail && S.detail.po);
  const why=await askText('ลบ P.O. '+(po?po.po_no:''), 'ระบุเหตุผล (ไม่บังคับ) — ดูหรือกู้คืนได้ที่หัวข้อ “🗑 ถูกลบ”', '', 'text', true);
  if(why==null) return;
  const old=Object.assign({}, po);
  const d=new Date();
  syncPo(Object.assign({}, po, {status:'DELETED', prev_status:po.status, deleted_by:S.user, deleted_at:ymdLocal(d)+' '+d.toTimeString().slice(0,8)}));
  render(); toast('ลบ P.O. แล้ว');
  bgCall('deletePO',{id, reason:why}, r=>syncPo(r), ()=>{ syncPo(old); render(); });
}
async function restorePo(id){
  const po=S.pos.find(p=>p.id===id) || S.detail.po, old=Object.assign({}, po);
  const st=po.prev_status && po.prev_status!=='DELETED' ? po.prev_status : 'RECEIVED';
  syncPo(Object.assign({}, po, {status:st, deleted_by:'', deleted_at:''})); render(); toast('กู้คืนแล้ว → '+(ST_LABEL[st]||st));
  bgCall('restorePO',{id}, r=>syncPo(r), ()=>{ syncPo(old); render(); });
}

/* =========================================================
 * ช่องค้นหาแบบมีตัวเลือก (บาร์โค้ด / SKU / ชื่อ → สินค้า JST, แบรนด์ → รายการแบรนด์)
 * ========================================================= */
const SUG={box:null, input:null, opts:[], i:-1, hover:false};
function allBrands(){
  const set=new Set((S.lists.brands||[]).map(b=>b.trim()).filter(Boolean));
  S.pos.forEach(p=>String(p.brands||'').split(',').forEach(b=>{ b=b.trim(); if(b) set.add(b); }));
  S.items.forEach(i=>{ if(i.brand) set.add(String(i.brand).trim()); });
  return [...set].sort((a,b)=>a.localeCompare(b));
}
function allCarriers(){
  const set=new Set(CARRIERS.concat(S.lists.carriers||[]));
  S.pos.forEach(p=>{ if(p.carrier) set.add(String(p.carrier).trim()); });
  return [...set].filter(Boolean);
}
/** ช่องที่มี data-list="carrier": เลือกจากรายการ หรือพิมพ์แล้วกดเพิ่ม (ระบบจำไว้ใช้ครั้งหน้า) */
function showListSuggest(inp){
  const type=inp.dataset.list, q=inp.value.trim(), ql=q.toLowerCase();
  const all = type==='carrier' ? allCarriers() : [];
  const exact=all.some(v=>v.toLowerCase()===ql);
  const pickV=v=>{ inp.value=v; inp.dispatchEvent(new Event('change',{bubbles:true})); };
  let opts=all.filter(v=>!ql || exact || v.toLowerCase().indexOf(ql)>=0).map(v=>({label:v, on:v.toLowerCase()===ql, pick:()=>pickV(v)}));
  if(q && !exact) opts.unshift({label:'＋ เพิ่มขนส่ง “'+q+'”', add:true, pick:async()=>{
    pickV(q); try{ S.lists=await call('addMaster',{type:'carrier', name:q}); toast('เพิ่มขนส่ง “'+q+'” แล้ว'); }catch(e){ fail(e); } }});
  renderSuggest(inp, opts);
}
document.addEventListener('focusin',e=>{ if(e.target.dataset && e.target.dataset.list) showListSuggest(e.target); });
document.addEventListener('input',e=>{ if(e.target.dataset && e.target.dataset.list) showListSuggest(e.target); });
document.addEventListener('click',e=>{ if(e.target.dataset && e.target.dataset.list && !SUG.box) showListSuggest(e.target); });
document.addEventListener('keydown',e=>{ if(SUG.box && SUG.input===e.target && e.target.dataset.list) sugKey(e); });
document.addEventListener('focusout',e=>{ if(e.target.dataset && e.target.dataset.list) setTimeout(()=>{ if(!SUG.hover) hideSuggest(); },150); });

function hideSuggest(){ if(SUG.box) SUG.box.remove(); SUG.box=null; SUG.input=null; SUG.opts=[]; SUG.i=-1; }
function fillRowFromProduct(row, p){
  const set=(k,v)=>{ const el=$('[data-k='+k+']',row); if(el && v!=null) el.value=v; };
  if(p.barcodes[0]) set('barcode', p.barcodes[0]);
  set('sku', p.sku); set('name', p.name);
  toast('เลือก '+(p.name||p.sku));
}
function showSuggest(inp){
  const k=inp.dataset.k, q=inp.value.trim();
  let opts=[];
  if(k==='brand'){
    const ql=q.toLowerCase(), all=allBrands();
    opts=all.filter(b=>!ql || b.toLowerCase().indexOf(ql)>=0).slice(0,30).map(b=>({label:b, pick:()=>{ inp.value=b; }}));
    if(q && !all.some(b=>b.toLowerCase()===ql)) opts.unshift({label:'＋ เพิ่มแบรนด์ “'+q+'”', add:true, pick:async()=>{
      inp.value=q; try{ S.lists=await call('addMaster',{type:'brand', name:q}); toast('เพิ่มแบรนด์ “'+q+'” เข้าระบบแล้ว'); }catch(e){ fail(e); } }});
    if(!opts.length) opts=[{label:'พิมพ์ชื่อแบรนด์ แล้วกด “＋ เพิ่มแบรนด์”', hint:true, pick:()=>inp.focus()}];
  } else {
    if(!S.prod || !S.prod.list.length || q.length<2){ hideSuggest(); return; }
    opts=searchProducts(q).slice(0,12).map(p=>({label:p.name||'(ไม่มีชื่อ)', sub:'SKU '+(p.sku||'-')+' • '+(p.barcodes.join(', ')||'ไม่มีบาร์โค้ด'),
      pick:()=>fillRowFromProduct(inp.closest('.ed-row'), p)}));
  }
  renderSuggest(inp, opts.map(o=>Object.assign({on: k==='brand' && o.label.toLowerCase()===q.toLowerCase()}, o)));
}
function renderSuggest(inp, opts){
  if(!opts.length){ hideSuggest(); return; }
  if(!SUG.box){
    SUG.box=document.createElement('div'); SUG.box.className='sug'; document.body.appendChild(SUG.box);
    SUG.box.onmouseenter=()=>SUG.hover=true; SUG.box.onmouseleave=()=>SUG.hover=false;
  }
  SUG.input=inp; SUG.opts=opts; SUG.i=-1;
  const r=inp.getBoundingClientRect(), w=Math.min(Math.max(r.width, 300), window.innerWidth-16);
  SUG.box.style.width=w+'px'; SUG.box.style.left=Math.max(8, Math.min(r.left, window.innerWidth-w-8))+'px';
  const below=window.innerHeight-r.bottom;
  if(below<220 && r.top>below){ SUG.box.style.top=''; SUG.box.style.bottom=(window.innerHeight-r.top+2)+'px'; }
  else { SUG.box.style.bottom=''; SUG.box.style.top=(r.bottom+2)+'px'; }
  SUG.box.innerHTML=opts.map((o,i)=>`<button type="button" data-i="${i}" class="${o.add?'add':''} ${o.on?'cur':''} ${o.hint?'hint':''}"><span class="ck">${o.on?'✓':''}</span><span class="tx">${h(o.label)}${o.sub?`<small>${h(o.sub)}</small>`:''}</span></button>`).join('');
  $$('button',SUG.box).forEach(b=>b.onmousedown=e=>{ e.preventDefault(); const o=SUG.opts[Number(b.dataset.i)]; hideSuggest(); SUG.hover=false; o.pick(); });
}
function sugKey(e){
  const n=SUG.opts.length; if(!n) return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); SUG.i=(SUG.i+(e.key==='ArrowDown'?1:-1)+n)%n;
    $$('button',SUG.box).forEach((b,i)=>b.classList.toggle('on',i===SUG.i)); }
  else if(e.key==='Enter' && SUG.i>=0){ e.preventDefault(); const o=SUG.opts[SUG.i]; hideSuggest(); o.pick(); }
  else if(e.key==='Escape') hideSuggest();
}
window.addEventListener('scroll',e=>{ if(SUG.box && !SUG.box.contains(e.target)) hideSuggest(); }, true);
window.addEventListener('resize', hideSuggest);

/* =========================================================
 * ดึงรายการสินค้าจากไฟล์ PDF (ฟรี — อ่านข้อความด้วย pdf.js ในเบราว์เซอร์)
 *  หาบาร์โค้ด 13 หลักในแต่ละบรรทัด → ชื่อจาก JST (ถ้าเจอ) หรือข้อความใน P.O. → เดาจำนวน
 * ========================================================= */
async function extractItemsFromPdf(po){
  const doc=await getPdfDoc(po);
  const poBrands=String(po.brands||'').split(',').map(x=>x.trim()).filter(Boolean);
  const seen={}, out=[];
  for(let pg=1; pg<=doc.numPages; pg++){
    const page=await doc.getPage(pg), tc=await page.getTextContent();
    const items=joinSplitCodes(tc.items.filter(t=>t.str && t.str.trim())
      .map(t=>({s:normThai(t.str), x:t.transform[4], y:t.transform[5], w:t.width||0})));
    // จัดเป็นบรรทัดตามแนวตั้ง
    const rows=[];
    items.forEach(t=>{ let r=rows.find(r=>Math.abs(r.y-t.y)<=3); if(!r){ r={y:t.y, parts:[]}; rows.push(r); } r.parts.push(t); });
    rows.sort((a,b)=>b.y-a.y).forEach(r=>{ r.parts.sort((a,b)=>a.x-b.x); r.text=r.parts.map(p=>p.s).join(' ').replace(/\s+/g,' '); });
    const nums=numberTokens(items);
    const taken=[];   // แถวที่ได้สินค้าแล้ว (กันรหัสอื่นในแถวเดียวกันนับซ้ำ)
    rows.forEach((r,ri)=>{
      if(/ภาษี|tax|vat\s*no/i.test(r.text)) return;                   // เลขประจำตัวผู้เสียภาษีก็ 13 หลัก
      const all=r.text.match(/(?:^|[^\d])(\d{13})(?=[^\d]|$)/g) || [];
      const codes=all.map(x=>x.replace(/\D/g,'')).filter(validEan13);
      // ไม่มีบาร์โค้ด → ลองหารหัสอื่นที่นำเข้าไว้ (เช่น Konvy ID)
      let ex=null;
      if(!codes.length && S.prod){
        const tok=(r.text.match(/[A-Za-z0-9-]{4,}/g)||[]).find(t=>/\d/.test(t) && S.prod.extraByCode[t.toUpperCase()]);
        if(tok) ex=S.prod.extraByCode[tok.toUpperCase()];
      }
      if(!codes.length && !ex) return;
      if(!codes.length && taken.some(y=>Math.abs(y-r.y)<=16)) return;
      let bc=codes.find(c=>S.prod && S.prod.byCode[c]) || codes[0];
      let exProd=null;
      if(!bc){ exProd=fromExtra(ex); bc=exProd.barcodes[0] || String(ex.code); }
      if(seen[bc]) return; seen[bc]=true; taken.push(r.y);
      const pos=r.text.lastIndexOf(codes.length ? bc : String(ex.code));
      const rest=r.text.slice(pos<0 ? 0 : pos + (codes.length ? 13 : String(ex.code).length));
      // 1) อ่านจากคอลัมน์จำนวนตามหัวตาราง  2) ถ้าหาไม่เจอ ค่อยเดาจากตัวเลขในบรรทัด
      let qty='', how='col';
      const head=findQtyHeader(items, r.y);
      if(head) qty=qtyUnderHeader(nums, head, r.y);
      if(qty===''){
        how='guess';
        let n=lineNumbers(rest);
        if(!n.length && ri>0) n=lineNumbers(rows[ri-1].text);
        qty=guessQty(n);
      }
      const text=rest.split(' ').filter(w=>!/^[\d,.]+$/.test(w)).join(' ').trim();
      const p=exProd || (S.prod && (S.prod.byCode[bc] || (S.prod.extraByCode[bc] && fromExtra(S.prod.extraByCode[bc]))));
      out.push({barcode:bc, name: p && p.name ? p.name : text, jst_sku: exProd && exProd.sku ? exProd.sku : '', brand: poBrands.length===1 ? poBrands[0] : '', qty, _how:how+(head?' ['+head.phrase+']':'')});
    });
  }
  return out;
}
/** บางแบบฟอร์ม (เช่น Konvy) ตัดบาร์โค้ด/รหัสเป็นหลายบรรทัดในช่องเดียว → ต่อชิ้นตัวเลขที่ซ้อนกันในคอลัมน์เดียวกัน
 *  รับเฉพาะผลที่เป็นบาร์โค้ด 13 หลักที่ถูกต้อง หรือรหัสที่มีในรหัสสินค้าเพิ่มเติม จึงไม่ต่อเลขข้ามแถวผิด ๆ */
function joinSplitCodes(items){
  const digits=t=>t.s.replace(/[^\d]/g,'');
  const isFrag=t=>/^[\d|]+$/.test(t.s.trim()) && digits(t).length>=2 && digits(t).length<=12;
  const used=new Set();
  items.forEach(t=>{
    if(used.has(t) || !isFrag(t)) return;
    const chain=[t]; let cur=t;
    for(let k=0;k<3;k++){
      const cx=cur.x+cur.w/2;
      const nx=items.find(o=>!used.has(o) && o!==cur && chain.indexOf(o)<0 && /^[\d|]+$/.test(o.s.trim())
        && Math.abs((o.x+o.w/2)-cx)<=4 && cur.y-o.y>0 && cur.y-o.y<=14);
      if(!nx) break;
      chain.push(nx); cur=nx;
      const joined=chain.map(digits).join('');
      let code='';
      if(joined.length>=13 && validEan13(joined.slice(0,13))) code=joined.slice(0,13);
      else if(S.prod && S.prod.extraByCode[joined]) code=joined;
      if(code){
        chain.forEach(o=>used.add(o));
        t.s=code; t.y=chain.reduce((a,o)=>a+o.y,0)/chain.length; t.joined=true;
        used.delete(t);
        return;
      }
      if(joined.length>=13) break;
    }
  });
  return items.filter(t=>!used.has(t) || t.joined);
}
function normThai(s){ return String(s).replace(/ํา/g,'ำ').replace(/ /g,' '); }
function lineNumbers(str){
  return str.split(' ').filter(w=>/^\d{1,3}(,\d{3})+(\.\d+)?$|^\d+(\.\d+)?$/.test(w)).map(w=>Number(w.replace(/,/g,'')));
}
/** ตัวเลขทุกตัวในหน้า พร้อมตำแหน่งกลางโดยประมาณ (ข้อความหนึ่งชิ้นอาจมีหลายตัวเลขคั่นด้วยช่องว่าง) */
function numberTokens(items){
  const out=[];
  items.forEach(t=>{
    const re=/\S+/g; let m;
    while((m=re.exec(t.s))){
      const w=m[0];
      if(!/^\d{1,3}(,\d{3})+(\.\d+)?$|^\d+(\.\d+)?$/.test(w)) continue;
      const len=Math.max(1,t.s.length);
      out.push({v:Number(w.replace(/,/g,'')), cx: t.x + ((m.index + w.length/2)/len)*t.w, y:t.y});
    }
  });
  return out;
}
// หัวคอลัมน์จำนวน: ให้คะแนนตามความหมาย และตัดคอลัมน์ที่เป็นราคา/หีบ/แพ็ค/ขนาดบรรจุทิ้ง
const QTY_WORD=/qty|quantity|จำนวน/i;
const QTY_BAD=/ราคา|price|amount|cost|มูลค่า|ส่วนลด|disc|vat|ภาษี|pack|box|ctn|pck|carton|case|หีบ|ลัง|บรรจุ|ต่อขนาด|uom|เงิน|รวมจำนวนเงิน/i;
function findQtyHeader(items, rowY){
  let best=null;
  items.forEach(t=>{
    if(!QTY_WORD.test(t.s) || t.y<=rowY+2 || t.y-rowY>400) return;       // หัวตารางต้องอยู่เหนือแถวสินค้า
    // รวมคำที่อยู่ซ้อนกันในหัวคอลัมน์เดียวกัน เช่น "Qty / in / PCS"
    const cx=t.x+t.w/2;
    const group=items.filter(o=>Math.abs((o.x+o.w/2)-cx)<=Math.max(18, t.w/2+6) && Math.abs(o.y-t.y)<=32 && o.y>rowY+8 && !/^[\d,.]+$/.test(o.s));
    const phrase=group.sort((a,b)=>b.y-a.y).map(o=>o.s).join(' ');
    if(QTY_BAD.test(phrase)) return;
    let score=1;
    if(/pcs|ชิ้น|หน่วยย่อย|each|piece/i.test(phrase)) score+=3;
    if(/receive|รับ/i.test(phrase)) score+=2;
    if(/order|สั่ง/i.test(phrase)) score+=1;
    const xs=group.map(o=>[o.x, o.x+o.w]);
    const left=Math.min(...xs.map(a=>a[0])), right=Math.max(...xs.map(a=>a[1]));
    const cand={score, cx:(left+right)/2, left, right, y:t.y, phrase};
    if(!best || cand.score>best.score || (cand.score===best.score && cand.y<best.y)) best=cand;
  });
  return best;
}
function qtyUnderHeader(nums, head, rowY){
  const tol=Math.max(28, (head.right-head.left)/2+16);
  const c=nums.filter(n=>Math.abs(n.cx-head.cx)<=tol && Math.abs(n.y-rowY)<=16 && n.v>0 && Number.isInteger(n.v));
  if(!c.length) return '';
  c.sort((a,b)=>(Math.abs(a.y-rowY)-Math.abs(b.y-rowY)) || (Math.abs(a.cx-head.cx)-Math.abs(b.cx-head.cx)));
  return c[0].v;
}
function validEan13(c){
  if(!/^\d{13}$/.test(c)) return false;
  let sum=0; for(let i=0;i<12;i++) sum+=Number(c[i])*(i%2?3:1);
  return (10-sum%10)%10===Number(c[12]);
}
function guessQty(n){
  const ints=n.map((x,i)=>({x,i})).filter(o=>Number.isInteger(o.x) && o.x>0);
  let best=0;
  // 1) หีบ × บรรจุ = จำนวนชิ้น (เช่น 10 40 400 / 6 … 4 … 24)
  for(const a of ints) for(const b of ints) if(b.i>a.i) for(const c of ints)
    if(c.i>b.i && a.x*b.x===c.x && c.x>a.x && c.x>b.x) best=Math.max(best,c.x);
  if(best) return best;
  // 2) ลัง × แพ็ค × ชิ้น (เช่น 5 ลัง ของ 3x12 = 180)
  for(const a of ints) for(const b of ints) for(const c of ints) for(const d of ints)
    if(a.i<b.i && b.i!==c.i && a.i!==c.i && d.i!==a.i && d.i!==b.i && d.i!==c.i && a.x*b.x*c.x===d.x && d.x>Math.max(a.x,b.x,c.x)) best=Math.max(best,d.x);
  if(best) return best;
  // 3) จำนวน × ราคา ≈ ยอดเงิน
  for(const a of ints) for(let j=a.i+1;j<n.length;j++) for(let k=j+1;k<n.length;k++)
    if(n[j]>0 && n[k]>n[j] && Math.abs(a.x*n[j]-n[k])<=Math.max(0.05, n[k]*0.002)) return a.x;
  // 4) ตัวเลขจำนวนเต็มตัวแรก
  return ints.length ? ints[0].x : '';
}
